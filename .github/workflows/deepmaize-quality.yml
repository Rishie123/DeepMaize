name: DeepMaize quality checks

on:
  push:
    branches: [deepmaize-kharif]
  pull_request:
    branches: [master, deepmaize-kharif]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn joblib pytest
      - name: Compile project Python files
        run: python -m compileall -q src data tests
      - name: Run unit tests
        run: python -m pytest -q
